[package]
name = "dumont"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = { version = "4.9.0", default-features = false, features = ["macros", "compress-gzip", "compress-brotli", "compress-zstd", "cookies"] }
dotenvy = "0.15.7"
env_logger = "0.11.5"
ipp = { version = "5.4", features = ["client"] }
anyhow = "1.0.89"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.154"
log = "0.4.22"
